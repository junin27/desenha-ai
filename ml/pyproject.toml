[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "desenha-ml"
version = "0.1.0"
description = "Núcleo testado do jogo Desenha Aí, Sô!: pré-processamento de traços, regras e curadoria do dataset do SLM."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gilberto Aparecido Dias Junior" }]
license = "MIT"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "build>=1.2"]
treino = ["torch>=2.4", "onnx>=1.16"]
teacher = ["google-genai>=1.0", "groq>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/desenha_ml"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

# Pillow só é usado pelo script das figuras do banner (scripts/figuras_do_banner.py), não pelo pacote.
[[tool.mypy.overrides]]
module = ["PIL", "PIL.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
# Arquivos de texto em prosa enviado ao Teacher: quebrar frases para caber em 110 colunas muda o prompt.
"src/desenha_ml/prompts_do_teacher.py" = ["E501"]
"src/desenha_ml/ficha_tecnica.py" = ["E501"]
