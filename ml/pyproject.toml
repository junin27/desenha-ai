[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "desenha-ml"
version = "0.1.0"
description = "Núcleo testado do jogo Desenha Aí, Sô!: pré-processamento de traços, regras e curadoria do dataset do SLM."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Gilberto Aparecido Dias Junior" }]
license = "MIT"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/desenha_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = ["RUF001", "RUF002", "RUF003", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]
