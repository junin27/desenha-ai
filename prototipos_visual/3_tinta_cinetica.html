<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tinta cinética</title>
<style>
  /* Paleta: papel branco-gelo, tinta grafite, um único acento vermelho-tomate e um azul-caneta */
  :root { --papel: #FBFAF7; --tinta: #16161A; --suave: #6E6E78; --tomate: #FF3D2E; --caneta: #2D5BFF; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--papel); color: var(--tinta);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }

  /* Rabiscos de fundo que se desenham e se apagam sozinhos (camada SVG) */
  #fundo { position: fixed; inset: 0; width: 100%; height: 100%; }
  #fundo path { fill: none; stroke: #D9D7D0; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  .palco { position: relative; height: 100%; display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; gap: 3vw; padding: 4vh 5vw; }

  /* Título em letras de contorno que se "desenham" (stroke) e depois ganham preenchimento */
  .titulo { width: 100%; max-width: 820px; overflow: visible; }
  .titulo text { font: 900 150px "Segoe UI Black", "Segoe UI", system-ui, sans-serif; letter-spacing: -6px;
    fill: transparent; stroke: var(--tinta); stroke-width: 2.5; stroke-dasharray: 1400; stroke-dashoffset: 1400;
    animation: contorno 2.4s cubic-bezier(.6,0,.2,1) forwards, enche .6s 2.2s forwards; }
  .titulo text.so { stroke: var(--tomate); animation-delay: .5s, 2.6s; }
  @keyframes contorno { to { stroke-dashoffset: 0; } }
  @keyframes enche { to { fill: var(--tinta); } }
  .titulo text.so { animation-name: contorno, enchetomate; }
  @keyframes enchetomate { to { fill: var(--tomate); } }
  /* Sublinhado à mão embaixo do título */
  .risco { fill: none; stroke: var(--caneta); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 900; stroke-dashoffset: 900;
    animation: contorno 1s 2.8s cubic-bezier(.7,0,.2,1) forwards; }

  .chamada { font-size: clamp(24px, 1.7vw, 32px); line-height: 1.35; max-width: 30ch; color: var(--suave);
    opacity: 0; animation: aparece .8s 3s forwards; }
  .chamada mark { background: linear-gradient(transparent 55%, rgba(255,61,46,.28) 55%); color: var(--tinta);
    background-size: 0% 100%; background-repeat: no-repeat; animation: marca .8s 3.8s forwards; }
  @keyframes marca { to { background-size: 100% 100%; } }
  @keyframes aparece { to { opacity: 1; } }

  /* Botão Jogar: contorno rabiscado que se redesenha no hover */
  .jogar { position: relative; margin-top: 5vh; background: none; border: 0; cursor: pointer; padding: 26px 66px;
    font: 800 36px/1 "Segoe UI", system-ui, sans-serif; color: var(--tinta); opacity: 0; animation: aparece .6s 3.4s forwards; }
  .jogar svg { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); overflow: visible; }
  .jogar path { fill: var(--tomate); stroke: var(--tinta); stroke-width: 4; stroke-dasharray: 800; stroke-dashoffset: 0; }
  .jogar span { position: relative; color: #fff; }
  .jogar:hover path { animation: rerabisca .7s ease-in-out; }
  @keyframes rerabisca { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
  .jogar:focus-visible { outline: 4px dashed var(--caneta); outline-offset: 8px; }

  /* Lado direito: o "quadro" é só uma moldura desenhada à mão */
  .demo { position: relative; }
  .moldura { position: absolute; inset: -14px; width: calc(100% + 28px); height: calc(100% + 28px); overflow: visible; pointer-events: none; }
  .moldura path { fill: none; stroke: var(--tinta); stroke-width: 3.5; stroke-linecap: round; }
  .folha { position: relative; padding: 26px; }
  .charada { font-size: 26px; line-height: 1.3; min-height: 70px; }
  .charada i { font-style: normal; color: var(--tomate); font-weight: 800; }
  .linha { display: grid; grid-template-columns: 290px 1fr; gap: 26px; margin-top: 10px; }
  #desenho { width: 290px; height: 290px; }
  #desenho path { fill: none; stroke: var(--caneta); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }

  /* Palpites: palavra escrita + traço de marcador que estica conforme a probabilidade */
  .palpite { position: relative; font-size: 28px; font-weight: 700; padding: 8px 0 18px; }
  .palpite .valor { float: right; font-variant-numeric: tabular-nums; color: var(--suave); }
  .palpite svg { position: absolute; left: 0; bottom: 2px; width: 100%; height: 16px; overflow: visible; }
  .palpite svg path { fill: none; stroke: #CFCDC6; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .6s cubic-bezier(.2,.9,.2,1); }
  .palpite.lider svg path { stroke: var(--tomate); }
  .palpite.lider { color: var(--tomate); }
  /* Tempo: lápis que encolhe? Não: um traço contínuo que se apaga da direita para a esquerda */
  .tempo { margin-top: 10px; font-size: 24px; color: var(--suave); }
  .tempo svg { width: 100%; height: 14px; display: block; margin-top: 4px; }
  .tempo path { stroke: var(--tinta); stroke-width: 6; stroke-linecap: round; fill: none; transition: stroke-dashoffset .6s; }

  /* Zé: personagem em linha contínua, cabeça balança e boca mexe quando fala */
  .ze { display: flex; gap: 16px; align-items: center; margin-top: 18px; }
  .ze svg { width: 96px; flex: none; overflow: visible; transform-origin: 50% 90%; animation: balanca 2.6s ease-in-out infinite; }
  .ze svg path, .ze svg circle, .ze svg ellipse { fill: none; stroke: var(--tinta); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes balanca { 50% { transform: rotate(-5deg); } }
  .ze .boca { transform-origin: center; transform-box: fill-box; }
  .ze.falando .boca { animation: boca .18s infinite alternate; }
  @keyframes boca { to { transform: scaleY(2.6); } }
  .fala { font-size: 26px; line-height: 1.3; min-height: 68px; }

  /* Veredito: palavra que se escreve sozinha por cima de tudo, circulada à mão */
  .veredito { position: absolute; left: 6%; top: 34%; width: 88%; pointer-events: none; overflow: visible; }
  .veredito text { font: 900 84px "Segoe UI Black", system-ui; fill: var(--tomate); stroke: var(--tomate); stroke-width: 2;
    paint-order: stroke; opacity: 0; transform: rotate(-8deg); transform-origin: center; transform-box: fill-box; }
  .veredito ellipse { fill: none; stroke: var(--tomate); stroke-width: 6; stroke-dasharray: 1500; stroke-dashoffset: 1500; }
  .veredito.mostra text { animation: aparece .3s forwards; }
  .veredito.mostra ellipse { animation: contorno .9s .2s cubic-bezier(.6,0,.2,1) forwards; }

  /* Transição de tela: pincelada que cobre tudo ao clicar em Jogar */
  .pincel { position: fixed; inset: 0; pointer-events: none; z-index: 9; }
  .pincel path { fill: none; stroke: var(--tomate); stroke-width: 420; stroke-linecap: round; stroke-dasharray: 4000; stroke-dashoffset: 4000; }
  .pincel.vai path { animation: contorno 1s cubic-bezier(.7,0,.2,1) forwards; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-delay: 0s !important; transition: none !important; } }
</style>
</head>
<body>
<svg id="fundo" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

<main class="palco">
  <section>
    <svg class="titulo" viewBox="0 0 820 360" role="img" aria-label="Desenha Aí, Sô!">
      <text x="6" y="140">Desenha</text>
      <text x="6" y="290">Aí, <tspan class="so">Sô!</tspan></text>
      <path class="risco" d="M20 330 C 180 310, 420 346, 640 318 S 790 330, 800 322"/>
    </svg>
    <p class="chamada">Você rabisca, <mark>duas redes neurais leem cada traço ao vivo</mark> e o Zé, uma IA que mora neste notebook, diz se você mandou bem.</p>
    <button class="jogar" id="jogar">
      <svg viewBox="0 0 300 100" preserveAspectRatio="none"><path d="M12 18 C 80 6, 220 4, 290 14 C 298 40, 296 70, 288 90 C 200 98, 90 96, 10 88 C 4 60, 6 36, 12 18 Z"/></svg>
      <span>Jogar →</span>
    </button>
  </section>

  <section class="demo">
    <svg class="moldura" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path vector-effect="non-scaling-stroke" d="M2 3 C 30 1, 70 4, 98 2 C 99 30, 97 70, 99 98 C 70 99, 30 97, 1 99 C 2 70, 0 30, 2 3"/>
    </svg>
    <div class="folha">
      <p class="charada" id="charada"></p>
      <div class="linha">
        <svg id="desenho" viewBox="0 0 300 300"></svg>
        <div>
          <div id="palpites"></div>
          <div class="tempo">tempo <b id="seg">20</b>s
            <svg viewBox="0 0 300 14" preserveAspectRatio="none"><path id="tempo" d="M4 7 C 80 4, 200 10, 296 6" stroke-dasharray="300" stroke-dashoffset="0"/></svg>
          </div>
        </div>
      </div>
      <div class="ze" id="ze">
        <svg viewBox="0 0 100 110" aria-hidden="true">
          <path d="M14 42 C 20 16, 80 16, 86 42"/><path d="M4 44 C 30 34, 70 34, 96 44"/>
          <ellipse cx="50" cy="64" rx="30" ry="28"/>
          <circle cx="39" cy="60" r="3"/><circle cx="61" cy="60" r="3"/>
          <path d="M30 52 L44 54 M56 54 L70 52"/>
          <ellipse class="boca" cx="50" cy="77" rx="9" ry="2.5"/>
          <path d="M34 92 C 40 104, 60 104, 66 92"/>
        </svg>
        <p class="fala" id="fala"></p>
      </div>
    </div>
    <svg class="veredito" id="veredito" viewBox="0 0 500 160" aria-hidden="true">
      <ellipse cx="250" cy="80" rx="236" ry="68"/>
      <text x="250" y="110" text-anchor="middle">ACERTOU!</text>
    </svg>
  </section>
</main>
<svg class="pincel" id="pincel" viewBox="0 0 1600 900" preserveAspectRatio="none"><path d="M-200 450 C 400 100, 1200 800, 1800 450"/></svg>

<script>
const espera = ms => new Promise(r => setTimeout(r, ms));
const NS = "http://www.w3.org/2000/svg";

/* Desenha um caminho SVG com stroke-dashoffset (o "efeito de traço") */
function riscar(alvo, d, duracao = 700) {
  const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); alvo.append(p);
  const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
  return p.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: duracao, easing: "cubic-bezier(.6,0,.2,1)", fill: "forwards" }).finished.then(() => p);
}

/* Fundo: doodles das 30 categorias se desenham, ficam um tempo e se apagam */
const doodles = ["M0 40 C 20 0, 60 0, 80 40 S 140 80, 160 40", "M10 60 L40 10 L70 60 Z", "M40 0 A40 40 0 1 0 40.1 0",
  "M0 30 C 30 -10, 50 70, 80 30 C 100 0, 120 60, 150 30", "M10 70 L10 20 L50 0 L90 20 L90 70 Z", "M0 50 Q40 0 80 50 Q120 100 160 50"];
const fundo = document.getElementById("fundo");
async function brotar() {
  const g = document.createElementNS(NS, "g"); const x = Math.random() * 1500, y = Math.random() * 820;
  g.setAttribute("transform", `translate(${x} ${y}) rotate(${Math.random() * 40 - 20}) scale(${.8 + Math.random()})`); fundo.append(g);
  await riscar(g, doodles[Math.random() * doodles.length | 0], 1400);
  await espera(2500); g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 800, fill: "forwards" }).finished.then(() => g.remove());
}
setInterval(brotar, 900);

/* Palpites com marcador: comprimento do traço = probabilidade */
const palpites = document.getElementById("palpites");
function mostrar(dados) {
  if (!palpites.children.length) dados.forEach(() => palpites.insertAdjacentHTML("beforeend",
    `<div class="palpite"><span class="nome"></span><span class="valor"></span><svg viewBox="0 0 300 16" preserveAspectRatio="none"><path d="M5 8 C 90 4, 200 12, 295 7" stroke-dasharray="300" stroke-dashoffset="300"/></svg></div>`));
  dados.forEach(([n, p], i) => { const el = palpites.children[i]; el.classList.toggle("lider", i === 0);
    el.querySelector(".nome").textContent = n; el.querySelector(".valor").textContent = p + "%";
    el.querySelector("path").style.strokeDashoffset = 300 - 3 * p; });
}

/* Fala do Zé: digitando com boca mexendo */
const ze = document.getElementById("ze"), fala = document.getElementById("fala");
async function falar(txt) { ze.classList.add("falando"); fala.textContent = "";
  for (const c of txt) { fala.textContent += c; await espera(24); } ze.classList.remove("falando"); }

const tracos = ["M40 140 L150 50 L260 140", "M60 126 L60 270 L240 270 L240 126", "M128 270 L128 200 L172 200 L172 270",
  "M82 160 L110 160 L110 188 L82 188 Z", "M200 92 L200 62 L220 62 L220 108"];
const etapas = [[["chapéu", 38], ["montanha", 27], ["casa", 14]], [["celeiro", 41], ["casa", 36], ["chapéu", 8]],
  [["casa", 71], ["celeiro", 19], ["igreja", 4]], [["casa", 88], ["celeiro", 7], ["igreja", 2]], [["casa", 96], ["celeiro", 3], ["igreja", 1]]];
const desenho = document.getElementById("desenho"), charada = document.getElementById("charada"),
  veredito = document.getElementById("veredito"), tempo = document.getElementById("tempo"), seg = document.getElementById("seg");

async function rodada() {
  desenho.innerHTML = ""; palpites.innerHTML = ""; veredito.classList.remove("mostra"); tempo.style.strokeDashoffset = 0; seg.textContent = 20;
  charada.innerHTML = "<i>Charada:</i> tem telhado, porta e janela, e é pra onde a gente volta no fim do dia.";
  await falar("Bora, sô! Mostra pras máquinas que ocê sabe rabiscar!");
  for (let i = 0; i < tracos.length; i++) { await riscar(desenho, tracos[i]); mostrar(etapas[i]);
    tempo.style.strokeDashoffset = 300 * (i + 1) / 8; seg.textContent = 20 - (i + 1) * 3; await espera(500); }
  veredito.classList.add("mostra");
  await falar("Ô trem bão! Casa com 96% de certeza. Ponto pro ocê!"); await espera(3500); rodada();
}
setTimeout(rodada, 3200);

/* Jogar: pincelada vermelha cobre a tela (seria a transição para a tela do apelido) */
document.getElementById("jogar").addEventListener("click", () => {
  const p = document.getElementById("pincel"); p.classList.remove("vai"); void p.offsetWidth; p.classList.add("vai"); });
</script>
</body>
</html>
